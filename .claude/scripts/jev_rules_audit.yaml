schema_version: carros.jev_rules_audit.v1
registry_version: audit-v2
status: draft_pending_human_review
scope: repo_audit
source_registry: jev_rules.yaml

# 为什么需要这一层
# ----------------
# jev_rules.yaml 里的判据是为「判一次 commit 改动」写的，判据原文里到处是
# 「本次改动是在消除冗余」「新增的产物被本次改动之前的代码调用」这类说法。
# 拿它去体检**存量文件**，等于问 Jev 一个不存在的「改动」—— 问题问错了，
# 它答得再确定也没有意义。
#
# 本文件有两种条目：
#   1. 覆盖判读 —— rule_id 与主表一致，只替换 criteria（哲学原文仍以主表为真源）
#   2. 派生新规则 —— rule_id 主表没有，**必须**写 derives_from 指明它派生自哪条
#      CarrorOS 规则。不许凭空发明规则；没有出处的条目会被运行器拒绝。
#
# 判读口径的三条共同纪律：
#   1. 只判证据，不判意图。文件里看不到的东西（作者当时怎么想）不进判据。
#   2. 事实由运行器喂进 repo_context（调用方清单、失效引用、最后改动），
#      判据只负责说明「这些事实满足到什么程度算符合」。
#   3. 拿不准就不给结论 —— 低置信走「不能判定」，不要硬凑一个「符合」。

rules:
  # ── 1. 是否最简实现 ──────────────────────────────────────────────
  - rule_id: soul.1.simple
    criteria_true: >-
      该资源的存在形式是最简的：它没有把本可以几行说清的事摊成一大坨，
      也没有为自己发明一套只有它自己使用的抽象。
    criteria_false: >-
      满足以下之一即判不符合：
      (a) 该资源里有相当比例的行数在做与本目录其它资源重复的事；
      (b) 它引入了只有它自己使用的抽象层（新增的基类 / 工厂 / 配置层，调用方只有它自己）；
      (c) 同样的能力在同一目录下已有一份更简的实现，且这一份没有提供额外的理由。

  # ── 2. 是否复用代替重复造轮子 ────────────────────────────────────
  - rule_id: soul.1.reuse
    criteria_true: >-
      该资源在做的事，仓库里没有第二份等价实现；或者它本身就是把多份重复实现
      收敛成一份的那一份。
    criteria_false: >-
      满足以下之一即判不符合：
      (a) 仓库里已有一份能力等价的资源，这一份是重复造轮子；
      (b) 它包装了一个官方或社区已有的方案，但没有留下「为什么不用原方案」的说明。

  # ── 3. 是否收益远大于噪声 ────────────────────────────────────────
  - rule_id: soul.7.gain
    criteria_true: >-
      该资源带来的增益明显大于它制造的噪声。满足以下之一：
      (a) 它被主链路调用（门禁、账本、编排、校验），而且是这些链路里不可省的一环；
      (b) 它是被注册表点名的基础设施（settings.json 的 hooks、index.md 的路由表、
          SKILL.md 的引用、其它 skill 的显式调用）。
      判「明显大于」时同时看噪声：文件越大、抽象越多、只为一个场景服务，噪声越大。
    criteria_false: >-
      满足以下之一即判不符合：
      (a) 自产自销：调用它的只有它自己所在的那一组文件，主流程不经过它；
      (b) 零调用方：没有任何资源、注册表或脚本引用它；
      (c) 增益与噪声相当 —— 例如为了一个小场景引入了一整个文件/整层抽象。
      注意：只要增益确实大于噪声就该判符合，不要因为它大就判不符合。

  # ── 4. 是否已经过时（派生自 soul.7 增益优先的「僵尸机制」）───────
  - rule_id: soul.7.stale
    derives_from: soul.7.gain
    text: >-
      无增量增益的冗余代码通过僵尸机制处置：要么接入主校验链路，要么直接删除。
    source: AGENTS.md:20
    rule_target: code
    judge_by: jev
    severity: medium
    failure_action: 删除或重新接入
    accept_at: 0.75
    reject_at: 0.30
    confidence_at: 0.55
    criteria_true: >-
      该资源仍然嵌在当前有效的链路里：它依赖的文件 / 命令 / 路径都还在，
      它服务的对象也没有被替换或删除。
    criteria_false: >-
      满足以下之一即判不符合：
      (a) 它依赖的文件、模块、命令或路径在仓库里已经不存在（见 repo_context 的
          「失效引用」一节，那里列的是实际检查过的结果）；
      (b) 它服务的对象已经被替换或删除 —— 它处理的正是那套已被移除的旧机制；
      (c) 它自己已经没有任何调用方，且没有在注册表里被点名。

  # ── 5. 是否已经无价值（派生自 soul.7 增益优先）──────────────────
  - rule_id: soul.7.worthless
    derives_from: soul.7.gain
    text: >-
      所有新增功能必须证明「单行为带来全局可量化增益 > 实现+维护成本」。
    source: AGENTS.md:20
    rule_target: code
    judge_by: jev
    severity: medium
    failure_action: 删除或重写
    accept_at: 0.75
    reject_at: 0.30
    confidence_at: 0.55
    criteria_true: >-
      该资源仍然在承担一份别人不会替它承担的职责 —— 拿掉它之后，
      某个链路会缺一块，而不是被现有的别处自然覆盖。
    criteria_false: >-
      满足以下之一即判不符合：
      (a) 拿掉它之后主链路仍然完整 —— 它做的事可以被现有的别处覆盖，
          或者它解决的问题在仓库里已经不存在了；
      (b) 它做的事只在自己这一组文件内部闭环，仓库整体不因它而多出任何能力；
      (c) 仓库里没有任何文档或代码能说出它带来的增益是什么。
      注意：判「无价值」要同时排除「过时」——如果它只是引用了不存在的东西
      （属于过时），不要重复算作无价值。
