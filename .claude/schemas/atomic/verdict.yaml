# Schema: verdict

# Version: v3

# Owner: harness-kit (shared)

# Description: 最终判定，被 14 个 skill 全部复用。v3 统一双法官命名：
#   - Oracle  (oracle_agent.py ORACLE_STATIC_PROMPT) — 第一审，静态分析
#   - Mate    (oracle_agent.py ORACLE_MATE_PROMPT)   — 第二审，运行时 TDD 冒烟
#   - 双法官 = Oracle + Mate 级联（被动响应：用户主动 OR L2 任务触发）
#   - meta_oracle.py 是独立回顾性评分模块（Meta-Oracle，与 Mate 不同）

# Consumers: ALL lx-* skills

# References:
#   oracle_agent.py  — 双法官主入口（ORACLE_STATIC_PROMPT + ORACLE_MATE_PROMPT）
#   meta_oracle.py   — 回顾性 G1-G4 评分（独立模块，非双法官）
#
# Archive (旧版，保留向后兼容，建议迁移到 oracle_agent.py / meta_oracle.py):
#   .claude/schemas/atomic/verdict_meta.yaml — (废弃，内容已合并至此)
#   .claude/schemas/atomic/verdict_static.yaml — (废弃，内容已合并至此)
#


status:
  type: enum
  values: [pass, blocked, warn, incomplete]
  required: true
  description: "判定状态"
confidence:
  type: enum
  values: [high, medium, low]
  required: false
  description: "判定置信度 — E2 幻觉守卫。high=有可复现证据支撑; medium=推理合理但未直接验证; low=推测/待确认"
summary:
  type: string
  required: true
  description: "判定摘要"
next_actions:
  type: array
  required: false
  items:
  type: object
  properties:
  action:
  type: string
  priority:
  type: enum
  values: [p0, p1, p2, p3]
  description: "建议的下一步动作"
evidence_summary:
  type: string
  required: true
  description: "证据摘要"
