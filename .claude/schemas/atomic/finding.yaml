# Schema: finding

# Version: v1

# Owner: harness-kit (shared)

# Description: 单个问题/发现项，被 10+ skill 复用



id:
  type: string
  required: true
  pattern: '^FIND-\d+$'
  description: "唯一标识"

rule_id:
  type: string
  required: true
  description: "触发的规则/检查项 ID"
  example: '"A1" | "SEC-03" | "VIS-12"'

severity:
  type: ref
  target: severity.yaml
  required: true
  description: "严重度"

file:
  type: string
  required: true
  description: "涉及文件/资源"

line:
  type: integer
  required: false
  description: "涉及行号（如适用）"

description:
  type: string
  required: true
  description: "问题描述"

evidence:
  type: string
  required: true
  description: "证据（代码片段/截图描述/命令输出）"

suggestion:
  type: string
  required: false
  description: "修复建议"

auto_fix_applied:
  type: boolean
  required: false
  default: false
  description: "是否已自动修复"

confidence:
  type: string
  required: false
  default: medium
  enum: [low, medium, high]
  description: "置信度：low(<70%)仅建议不自动修, medium(70-85%), high(>85%)"

autofix_level:
  type: string
  required: false
  enum: [safe, review, suggest]
  description: "自动修复等级：safe可自动落盘, review生成patch, suggest仅建议"
