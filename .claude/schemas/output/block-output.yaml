# Schema: block-output.yaml
#
# Version: v1
#
# Owner: harness-kit (shared)
#
# Description: Hook 节点 → CC 运行时的阻断输出协议。
# 所有调用 sys.exit(2)/{"continue": false} 的 hook 必须输出此格式。
#
# Output of: 任何 CC hook（PretoolUse / PostToolUse / UserPromptSubmit）
# Consumed by: Claude Code 运行时（系统处理 continue: false）

---

continue:
  type: boolean
  required: true
  const: false
  description: "CC hook 协议信号，固定为 false 表示阻断"
  example: false

block_type:
  type: string
  required: true
  description: "阻断类型标识，下游节点据此做分类路由"
  example: '"build_fail" | "completion_gate" | "claim_audit_cold" | "permission_denied"'

reason:
  type: string
  required: true
  max_length: 200
  description: "简短的人类可读原因（给 CC reason 字段）"
  example: '"连续 12 次构建失败达到阈值，涉及 3 种不同错误"'

detail:
  type: object
  required: false
  description: "结构化详情，按 block_type 不同提供不同字段"
  fields:
    attempts:
      type: integer
      required: false
      description: "尝试次数"
    distinct_errors:
      type: integer
      required: false
      description: "不同错误种类数"
    signatures:
      type: array
      required: false
      items: { type: string }
      description: "前 N 条错误签名"
      max_items: 10
    last_command:
      type: string
      required: false
      description: "最近一次失败的命令"
    last_output:
      type: string
      required: false
      description: "最近一次失败的错误输出"
      max_length: 2000
    suggestions:
      type: array
      required: false
      items: { type: string }
      description: "下一步建议列表"

recover:
  type: object
  required: false
  description: "恢复/继续路径（给下游节点或用户）"
  fields:
    method:
      type: string
      required: false
      description: "恢复方式"
      example: '"manual_rca" | "override_reset" | "retry_after_fix"'
    state_file:
      type: string
      required: false
      description: "状态文件路径（删除即清除阻断）"
    resume_command:
      type: string
      required: false
      description: "推荐恢复命令"
