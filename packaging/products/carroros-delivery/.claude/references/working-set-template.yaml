# working-set.yaml — L2 上下文白名单

schema_version: carros.working_set.v1
level: L2

# 本轮任务允许上下文预算
budget:
  max_turns_soft: 15
  max_turns_hard: 25
  controllable_tokens_soft: 8000
  controllable_tokens_hard: 12000

# 允许操作的文件/目录白名单
# 任务级契约（INV-06：只改 allowed_paths）。AI 在 research/planning 阶段
# 按任务声明补充实际接触路径：仓库内产物目录 + 仓库外输入/输出（如
# /Users/xx/Desktop/daily_tasks/）。支持绝对路径前缀声明。
#
# index52（2026-09-11）默认值修正：
#   原默认 `src/ tests/ docs/` 与本仓实际结构不符（本仓是治理层，无 src/）。
#   一旦路径契约门禁上线，写 `.claude/scripts/**` 等合法路径会被**误拦**（实测误拦率 33%）。
#   故默认改为「**不约束范围**」（`./`）——只由 denied_paths 兜底，不误拦；
#   需要严格管控的任务请**自行收窄**（如只留本次涉及的目录），收窄后立即生效。
allowed_paths:
  - ./

# 禁止操作
denied_paths:
  - .env
  - secrets/
  - .ssh/
  - .aws/
  - docs/carros/reviews/

# 上下文管控
context:
  hot_card: true
  max_file_reads_per_tick: 2
  max_preview_items: 2
  require_plan_review: true
  require_evidence_for_verify: true
  retry_gate: true
  max_retries: 3

# 验证要求
verify:
  require_evidence: true
  require_plan_match: true
  allow_oracle: conditional  # only for high residual risk
